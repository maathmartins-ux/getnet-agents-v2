[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "anthropic>=2.3",
]

[project.optional-dependencies]
# ruff com versão exata: regras padrão mudam entre versões e o CI divergiria da máquina local.
dev = ["pytest>=8", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conjunto explícito: não depender do padrão da versão instalada.
select = ["E", "F", "W", "I", "B", "UP"]
