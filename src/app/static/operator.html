<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console do operador</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5b6475; --accent:#d4001a; --line:#e2e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --card:#1e2128; --ink:#e8eaee; --muted:#9aa3b2; --line:#2c313b; } }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  input, textarea, button { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  main { padding:16px; display:grid; gap:12px; max-width:900px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .meta { color:var(--muted); font-size:13px; }
  .msg { margin:4px 0; } .msg b { text-transform:uppercase; font-size:12px; color:var(--muted); }
  textarea { width:100%; box-sizing:border-box; min-height:64px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Fila de atendimento humano</h1>
  <input id="token" type="password" placeholder="X-Operator-Token" aria-label="Token do operador">
  <button id="load">Carregar fila</button>
  <span id="status" class="meta"></span>
</header>
<main id="queue"></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load() {
  const r = await fetch("/handoffs", { headers: { "X-Operator-Token": $("token").value } });
  if (!r.ok) { $("status").textContent = "Erro " + r.status; return; }
  const items = await r.json();
  $("status").textContent = items.length + " caso(s) aberto(s)";
  $("queue").innerHTML = items.map((t) => `
    <section class="card" data-id="${esc(t.id)}">
      <div><b>${esc(t.id)}</b> · motivo: ${esc(t.reason)} · lojista: ${esc(t.user_id)}</div>
      <div class="meta">${esc(t.summary)}</div>
      ${(t.messages || []).map((m) => `<div class="msg"><b>${esc(m.role)}</b> ${esc(m.content)}</div>`).join("")}
      <textarea placeholder="Resposta ao lojista"></textarea>
      <button class="reply">Responder e devolver à conversa</button>
    </section>`).join("");
}
$("load").onclick = load;
$("queue").onclick = async (e) => {
  if (!e.target.classList.contains("reply")) return;
  const card = e.target.closest(".card");
  const answer = card.querySelector("textarea").value.trim();
  if (!answer) return;
  const r = await fetch(`/handoffs/${card.dataset.id}/reply`, { method: "POST",
    headers: { "X-Operator-Token": $("token").value, "Content-Type": "application/json" },
    body: JSON.stringify({ answer }) });
  $("status").textContent = r.ok ? "Respondido: " + card.dataset.id : "Erro " + r.status;
  load();
};
</script>
</body>
</html>
